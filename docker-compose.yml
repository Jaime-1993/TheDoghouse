services:
  db:
    image: postgres:15-alpine
    container_name: thedoghouse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: thedoghouse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - thedoghouse-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: thedoghouse-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/thedoghouse?sslmode=disable
    depends_on:
      - db
    networks:
      - thedoghouse-network

volumes:
  postgres_data:

networks:
  thedoghouse-network:
    driver: bridge
